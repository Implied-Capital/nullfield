[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nullfield"
version = "0.1.0"
description = "Skills and persistent memory for quantitative research with coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/Implied-Capital/nullfield"
Issues = "https://github.com/Implied-Capital/nullfield/issues"

[project.scripts]
nullfield = "nullfield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nullfield = ["skills/research/SKILL.md", "skills/research/references/*.md"]
