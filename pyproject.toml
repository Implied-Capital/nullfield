[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-harness"
version = "0.1.0"
description = "Shared research projects, notebooks, and skills for existing coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
qr = "quant_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_research = ["skills/research/SKILL.md"]
